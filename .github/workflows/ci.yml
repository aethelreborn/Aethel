name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://aethel:aethel@localhost:5432/aethel
      - run: npm run build

  backend-boot:
    name: Backend boot test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f backend/Dockerfile.production -t aethel-boot .
      - name: Run container and probe /api/health
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          docker run -d --name boot -p 18080:10000 \
            -e NODE_ENV=production \
            -e PORT=10000 \
            -e DATABASE_URL="$PROD_DATABASE_URL" \
            -e JWT_SECRET="ci-boot-test-secret-ci-boot-test-secret-0123456789" \
            -e JWT_REFRESH_SECRET="ci-boot-test-refresh-ci-boot-test-refresh-0123" \
            -e FRONTEND_URL="https://aethel-dash.vercel.app" \
            aethel-boot
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/health; then
              echo; ok=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' boot 2>/dev/null)" != "true" ]; then
              echo "container exited early"; break
            fi
            sleep 2
          done
          echo "----- container logs -----"
          docker logs boot || true
          if [ -z "$ok" ]; then
            echo "BOOT_FAILED exit=$(docker inspect -f '{{.State.ExitCode}}' boot 2>/dev/null)"
            exit 1
          fi
          echo BOOT_OK

  config:
    name: Build config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Shipped binaries bake this address in. Without it every install can
      # only reach localhost and sign-in fails with "The vault server cannot
      # be reached" — fail before building anything instead of publishing a
      # broken release.
      - name: Require AETHEL_API_URL
        env:
          AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
        run: |
          if [ -z "$AETHEL_API_URL" ]; then
            echo "::error::Repository variable AETHEL_API_URL is not set; builds would only reach localhost. Set it with: gh variable set AETHEL_API_URL --body https://your-api.example.com"
            exit 1
          fi
          echo "Vault server baked into builds: $AETHEL_API_URL"

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  web:
    name: Web
    needs: [config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aethel_app
    env:
      AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href / --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      - name: Package static site
        run: |
          cd build/web
          zip -qr ../../../aethel-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-web
          path: aethel-web.zip
          if-no-files-found: error

  linux:
    name: Linux
    needs: [config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aethel_app
    env:
      AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-13-dev
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      # A single-file executable instead of an archive the user has to unpack
      # and then hunt for the launcher inside.
      - name: Package AppImage
        run: |
          set -euo pipefail
          bundle="build/linux/x64/release/bundle"
          appdir="build/appimage/Aethel.AppDir"

          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin"
          cp -a "$bundle/." "$appdir/usr/bin/"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/aethel" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          cat > "$appdir/aethel.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Aethel
          Comment=Private vault, bill ledger and focus timer
          Exec=aethel
          Icon=aethel
          Categories=Utility;Security;
          Terminal=false
          DESKTOP

          cp web/icons/Icon-512.png "$appdir/aethel.png"

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$appdir" "$PWD/../aethel-linux-x64.AppImage"
          test -x ../aethel-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-linux-x64
          path: aethel-linux-x64.AppImage
          if-no-files-found: error

  android:
    name: Android
    needs: [config]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    env:
      AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      - run: flutter build appbundle --release --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      # Publish the APK itself, not a zip around it: an APK inside an archive
      # cannot be installed without unpacking it first.
      - name: Stage installables
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../aethel-android.apk
          cp build/app/outputs/bundle/release/app-release.aab ../aethel-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-android
          path: |
            aethel-android.apk
            aethel-android.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: [config]
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    env:
      AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      - name: Package Runner.app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../aethel-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-ios-unsigned
          path: aethel-ios-unsigned.zip
          if-no-files-found: error

  macos:
    name: macOS
    needs: [config]
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    env:
      AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      - name: Package DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -f ../aethel-macos.dmg
          hdiutil create -volname "Aethel" -srcfolder "$APP_PATH" -ov -format UDZO ../aethel-macos.dmg
          test -f ../aethel-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-macos
          path: aethel-macos.dmg
          if-no-files-found: error

  windows:
    name: Windows
    needs: [config]
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    env:
      AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows app
        shell: bash
        run: flutter build windows --release --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      # Flutter's output is a folder full of DLLs; an installer turns it into
      # the single .exe download people expect.
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read version from pubspec.yaml"
          }
          $version = $Matches[1]
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc "/DAppVersion=$version" "installer\windows\aethel.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Copy-Item build\installer\aethel-windows-x64-setup.exe ..\aethel-windows-x64-setup.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-windows-x64
          path: aethel-windows-x64-setup.exe
          if-no-files-found: error

  pages:
    name: Landing page
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-web:
    name: Deploy dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [config, flutter]
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_URL: ${{ vars.AETHEL_API_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret not set — skipping dashboard deploy."
          elif [ -z "$API_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AETHEL_API_URL variable not set — skipping dashboard deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web (production API URL baked in)
        if: steps.guard.outputs.ready == 'true'
        working-directory: aethel_app
        env:
          AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
        run: |
          flutter pub get
          flutter build web --release --base-href / --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      - name: Deploy to Vercel
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.2.0 deploy ./aethel_app/build/web --prod --yes --token "$VERCEL_TOKEN"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, flutter, web, linux, android, ios, macos, windows]
    permissions:
      contents: write
    steps:
      # gh release needs a git repository for the tag/remote context.
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Every job already uploads a ready-to-install file, so the release is a
      # flat set of binaries rather than zips wrapping zips.
      - name: Assemble release assets
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          missing=0
          for asset in \
            aethel-linux-x64.AppImage \
            aethel-windows-x64-setup.exe \
            aethel-macos.dmg \
            aethel-android.apk \
            aethel-android.aab \
            aethel-ios-unsigned.zip \
            aethel-web.zip; do
            if [ ! -f "release/$asset" ]; then
              echo "::error::Missing release asset: $asset"
              missing=1
            fi
          done
          ls -la release
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Aethel $GITHUB_REF_NAME"
          fi
