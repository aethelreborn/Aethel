name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://aethel:aethel@localhost:5432/aethel
      - run: npm run build

  backend-boot:
    name: Backend boot test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f backend/Dockerfile.production -t aethel-boot .
      - name: Run container and probe /api/health
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          docker run -d --name boot -p 18080:10000 \
            -e NODE_ENV=production \
            -e PORT=10000 \
            -e DATABASE_URL="$PROD_DATABASE_URL" \
            -e JWT_SECRET="ci-boot-test-secret-ci-boot-test-secret-0123456789" \
            -e JWT_REFRESH_SECRET="ci-boot-test-refresh-ci-boot-test-refresh-0123" \
            -e FRONTEND_URL="https://aethel-dash.vercel.app" \
            aethel-boot
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/health; then
              echo; ok=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' boot 2>/dev/null)" != "true" ]; then
              echo "container exited early"; break
            fi
            sleep 2
          done
          echo "----- container logs -----"
          docker logs boot || true
          if [ -z "$ok" ]; then
            echo "BOOT_FAILED exit=$(docker inspect -f '{{.State.ExitCode}}' boot 2>/dev/null)"
            exit 1
          fi
          echo BOOT_OK

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-web
          path: aethel_app/build/web
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-13-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package bundle
        run: tar -czf ../aethel-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-linux-x64
          path: aethel-linux-x64.tar.gz
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-android
          path: |
            aethel_app/build/app/outputs/flutter-apk/app-release.apk
            aethel_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package Runner.app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../aethel-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-ios-unsigned
          path: aethel-ios-unsigned.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package Aethel.app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../aethel-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-macos
          path: aethel-macos.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../aethel-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-windows-x64
          path: aethel-windows-x64.zip
          if-no-files-found: error

  pages:
    name: Landing page
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-web:
    name: Deploy dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_URL: ${{ vars.AETHEL_API_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret not set — skipping dashboard deploy."
          elif [ -z "$API_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AETHEL_API_URL variable not set — skipping dashboard deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web (production API URL baked in)
        if: steps.guard.outputs.ready == 'true'
        working-directory: aethel_app
        env:
          AETHEL_API_URL: ${{ vars.AETHEL_API_URL }}
        run: |
          flutter pub get
          flutter build web --release --base-href / --dart-define=AETHEL_API_URL="$AETHEL_API_URL"
      - name: Deploy to Vercel
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.2.0 deploy ./aethel_app/build/web --prod --yes --token "$VERCEL_TOKEN"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, flutter, web, linux, android, ios, macos, windows]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble release assets
        run: |
          mkdir -p release
          (cd dist/aethel-web && zip -qr ../release/aethel-web.zip .)
          (cd dist/aethel-linux-x64 && zip -qr ../release/aethel-linux-x64.zip .)
          cp dist/aethel-ios-unsigned/aethel-ios-unsigned.zip release/
          cp dist/aethel-macos/aethel-macos.zip release/
          cp dist/aethel-windows-x64/aethel-windows-x64.zip release/
          (cd dist/aethel-android && zip -qr ../release/aethel-android.zip .)
          ls -la release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Aethel $GITHUB_REF_NAME"
          fi
