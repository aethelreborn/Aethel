services:
  - type: web
    name: aethel-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: aethel-db
          property: externalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://aethelreborn.github.io/Aethel/
      - key: AETHEL_PAY_GATEWAY_URL
        value: https://aethelpay.vercel.app
      - key: AETHEL_PAY_MERCHANT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: AETHEL_PAY_MERCHANT_KEY
        sync: false
      - key: AETHEL_PAY_RETURN_URL
        value: https://aethelreborn.github.io/Aethel/

databases:
  - name: aethel-db
    plan: free
    databaseName: aethel
    user: aethel
