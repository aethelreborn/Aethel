name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://aethel:aethel@localhost:5432/aethel
      - run: npm run build

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-web
          path: aethel_app/build/web
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-13-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package bundle
        run: tar -czf ../aethel-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-linux-x64
          path: aethel-linux-x64.tar.gz
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-android
          path: |
            aethel_app/build/app/outputs/flutter-apk/app-release.apk
            aethel_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package Runner.app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../aethel-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-ios-unsigned
          path: aethel-ios-unsigned.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package Aethel.app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../aethel-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-macos
          path: aethel-macos.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aethel_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../aethel-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aethel-windows-x64
          path: aethel-windows-x64.zip
          if-no-files-found: error
