name: aethel
description: A zero-knowledge password vault, bill tracker, and focus blocker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  http_parser: ^4.0.2

  # Local storage
  sqflite: ^2.3.3+1
  sqflite_sqlcipher: 3.4.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Security / crypto
  flutter_secure_storage: 9.2.2
  equatable: ^2.0.5
  pointycastle: 3.9.1
  args: ^2.5.0

  # Auth
  local_auth: 2.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  share_plus: ^9.0.0


  # Charts / UI
  fl_chart: 0.66.2
  table_calendar: 3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
