name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (tsc build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-directory: backend
      - run: cd backend && npm ci
      - run: cd backend && npm run build

  flutter:
    name: Flutter (analyze + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
      - run: cd aethel_app && flutter pub get
      - run: cd aethel_app && flutter analyze
      - run: cd aethel_app && dart format lib --set-exit-if-changed --output=none
      - run: cd aethel_app && flutter test
