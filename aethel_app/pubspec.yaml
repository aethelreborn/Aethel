name: aethel
description: A private vault, bill ledger, and focus timer that keeps your data on your device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5

  # Storage
  shared_preferences: ^2.3.2

  # Security / crypto
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  local_auth: ^2.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
          weight: 400
        - asset: assets/fonts/Fraunces.ttf
          weight: 500
        - asset: assets/fonts/Fraunces.ttf
          weight: 600
        - asset: assets/fonts/Fraunces.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
